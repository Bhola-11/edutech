{% if messages %}
    <div class="messages-container mb-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm d-flex align-items-center" role="alert">
                {% if message.tags == 'success' %}
                    <i class="bi bi-check-circle-fill me-2 fs-5 text-success"></i>
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 text-danger"></i>
                {% elif message.tags == 'warning' %}
                    <i class="bi bi-exclamation-circle-fill me-2 fs-5 text-warning"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
                {% endif %}
                <div class="flex-grow-1">{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
